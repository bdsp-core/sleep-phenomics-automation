<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — SPA Docs</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f7f9fc;
            color: #222;
            line-height: 1.7;
        }
        header {
            background: #4a90e2;
            color: #fff;
            padding: 14px 32px;
            font-size: 13px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-weight: 600;
        }
        #content {
            max-width: 780px;
            margin: 40px auto 80px;
            padding: 0 24px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 40px 48px;
        }
        #content h1 { font-size: 1.8em; color: #1a3a5c; margin-bottom: 12px; }
        #content h2 { font-size: 1.2em; color: #2c5282; margin: 28px 0 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
        #content h3 { font-size: 1em; color: #2d3748; margin: 20px 0 6px; }
        #content p  { margin-bottom: 12px; color: #444; }
        #content ul, #content ol { margin: 8px 0 12px 24px; color: #444; }
        #content li { margin-bottom: 4px; }
        #content table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
            font-size: 0.92em;
        }
        #content th {
            background: #eef3fb;
            color: #2c5282;
            text-align: left;
            padding: 8px 12px;
            border: 1px solid #d0daea;
        }
        #content td {
            padding: 7px 12px;
            border: 1px solid #e2e8f0;
            vertical-align: top;
        }
        #content tr:nth-child(even) td { background: #f7faff; }
        #content code {
            background: #eef3fb;
            border-radius: 4px;
            padding: 1px 5px;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.88em;
            color: #2c5282;
        }
        #content pre {
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 6px;
            padding: 16px;
            overflow-x: auto;
            margin: 12px 0;
        }
        #content pre code { background: none; color: inherit; padding: 0; }
        #content blockquote {
            border-left: 4px solid #4a90e2;
            padding: 8px 16px;
            margin: 16px 0;
            background: #eef3fb;
            border-radius: 0 6px 6px 0;
            color: #555;
        }
        #content strong { color: #1a3a5c; }
        #loading { text-align: center; padding: 60px; color: #888; font-size: 15px; }
    </style>
</head>
<body>
    <header>SPA &mdash; Phenomics Documentation</header>
    <div id="content"><div id="loading">Loading…</div></div>
    <script>
        fetch('{{ md_url }}')
            .then(r => {
                if (!r.ok) throw new Error('File not found');
                return r.text();
            })
            .then(md => {
                document.getElementById('content').innerHTML = marked.parse(md);
                document.title = document.querySelector('h1')?.textContent + ' — SPA Docs';
            })
            .catch(() => {
                document.getElementById('content').innerHTML =
                    '<p style="color:#c00">Documentation not found for this feature.</p>';
            });
    </script>
</body>
</html>
